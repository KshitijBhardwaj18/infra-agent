services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heizen
      POSTGRES_PASSWORD: heizen
      POSTGRES_DB: heizen
    ports:
      - "5432:5432"
    volumes:
      - heizen_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - heizen_redis_data:/data

volumes:
  heizen_pg_data:
  heizen_redis_data:
